<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Mobile: the page is a fixed-viewport game surface, not a document.
      maximum-scale/user-scalable lock out pinch-zoom and double-tap zoom, and
      viewport-fit=cover lets the canvas reach under the notch (the HUD and the
      on-screen controls pad themselves with env(safe-area-inset-*)).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERWATCH" />
    <meta name="format-detection" content="telephone=no" />
    <title>OVERWATCH — Tactical Shooter</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        /* A game surface must not scroll, bounce, zoom, or select text. */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none; user-select: none;
        touch-action: none;
      }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* mobile toolbars: the visual viewport, not the layout one */
        touch-action: none;
        cursor: none;
        background: #000;
      }
      /* Boot gate: the level is generated procedurally, which takes seconds on a
         phone. Without this the player stares at black until the first frame. */
      #ow-boot {
        position: fixed; inset: 0; z-index: 40;
        display: grid; place-items: center; text-align: center;
        background: radial-gradient(ellipse 80% 70% at 50% 45%, #0b1016, #030507 85%);
        color: rgba(238,244,247,.92);
        font: 700 12px/1.6 "Avenir Next Condensed", "DIN Alternate", "Roboto Condensed",
          "Arial Narrow", system-ui, sans-serif;
        letter-spacing: .3em; text-transform: uppercase;
        transition: opacity .4s linear;
      }
      #ow-boot.gone { opacity: 0; pointer-events: none; }
      #ow-boot .t { font-size: 26px; letter-spacing: .38em; text-indent: .38em; margin-bottom: 18px; }
      #ow-boot .s { color: rgba(214,227,234,.55); font-size: 10px; }
      #ow-boot .bar {
        margin: 22px auto 0; width: 172px; height: 2px;
        background: rgba(255,255,255,.10); overflow: hidden;
      }
      #ow-boot .bar i {
        display: block; height: 100%; width: 40%;
        background: #ffb02a;
        animation: ow-boot-slide 1.25s cubic-bezier(.45,.05,.55,.95) infinite;
      }
      @keyframes ow-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ow-boot .bar i { animation: none; width: 100%; opacity: .5; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BdFmHAmJ.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="ow-boot">
      <div>
        <div class="t">OVERWATCH</div>
        <div class="s">Generating level · compiling shaders</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
